<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="tone" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="9" cy="9" r="4.2" fill="#16171c"/>
    </pattern>
    <clipPath id="p1"><polygon points="92,92 420,92 420,214 92,250"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#2346d6"/>
  <!-- 紙 -->
  <rect x="68" y="68" width="376" height="376" rx="10" fill="#16171c"/>
  <!-- 上の大ゴマ（トーン） -->
  <polygon points="92,92 420,92 420,214 92,250" fill="#ffffff"/>
  <rect x="92" y="92" width="328" height="160" fill="url(#tone)" clip-path="url(#p1)" opacity=".9"/>
  <!-- ふきだし -->
  <ellipse cx="318" cy="150" rx="78" ry="42" fill="#ffffff" stroke="#16171c" stroke-width="10"/>
  <polygon points="270,180 250,214 300,186" fill="#ffffff" stroke="#16171c" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="318" cy="150" rx="70" ry="35" fill="#ffffff"/>
  <!-- 左下のコマ -->
  <polygon points="92,274 236,258 214,420 92,420" fill="#ffffff"/>
  <!-- 右下のコマ（アクセント） -->
  <polygon points="260,255 420,238 420,420 238,420" fill="#ffd43b"/>
  <!-- 集中線 -->
  <g stroke="#16171c" stroke-width="7" stroke-linecap="round">
    <line x1="114" y1="398" x2="150" y2="352"/><line x1="140" y1="404" x2="170" y2="366"/><line x1="112" y1="364" x2="136" y2="334"/>
  </g>
</svg>
